<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord</title>
<link rel="icon" href="icon128.png">
<style>
  :root {
    --blurple: #5865f2;
    --blurple-hover: #4752c4;
    --roxo: #9b4de0;
    --fundo-card: #313338;
    --fundo-campo: #2b2d31;
    --borda: #3f4147;
    --texto: #f2f3f5;
    --texto-2: #b5bac1;
    --texto-3: #949ba4;
    --verde: #23a55a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "gg sans", "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--texto);
    background: #1e1f22;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
    position: relative;
  }
  /* fundo no estilo da tela de login: gradiente blurple com formas soltas */
  .ceu {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(1200px 600px at 10% 110%, rgba(155, 77, 224, .55), transparent 60%),
      radial-gradient(900px 500px at 95% -10%, rgba(88, 101, 242, .65), transparent 60%),
      linear-gradient(160deg, #404eed 0%, #2c2f8f 45%, #1e1f22 100%);
  }
  .ceu i {
    position: absolute; border-radius: 50%;
    background: rgba(255, 255, 255, .9);
    width: 3px; height: 3px; opacity: .5;
  }
  .ceu b {
    position: absolute; border-radius: 24px;
    background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.08);
    transform: rotate(-14deg);
  }
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 480px;
    background: var(--fundo-card);
    border-radius: 8px;
    box-shadow: 0 2px 10px 0 rgba(0,0,0,.2), 0 24px 64px rgba(0,0,0,.35);
    padding: 32px;
    text-align: center;
  }
  h1 { font-size: 24px; line-height: 30px; margin: 14px 0 8px; font-weight: 700; }
  .sub { color: var(--texto-2); font-size: 16px; line-height: 22px; margin: 0 0 22px; }
  .acoes { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .botao {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--blurple); color: #fff; text-decoration: none;
    font-size: 16px; font-weight: 600;
    height: 44px; padding: 0 22px; border-radius: 4px;
    transition: background .17s ease;
  }
  .botao:hover { background: var(--blurple-hover); }
  .botao:focus-visible { outline: 3px solid #00a8fc; outline-offset: 2px; }
  .app {
    width: 96px; height: 96px; border-radius: 24px; cursor: default;
    box-shadow: 0 12px 32px rgba(91, 91, 247, .45);
    margin: 0 auto 20px; display: block;
  }
  .acoes { justify-content: center; flex-direction: column; gap: 14px; }
  .botao { width: 100%; }
  .volta { color: #00a8fc; font-size: 14px; text-decoration: none; }
  .volta:hover { text-decoration: underline; }
  #passe { margin-top: 18px; width: 100%; text-align: left; }
  #passe label { display: block; margin-bottom: 8px; color: var(--texto-2); font-size: 12px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
  #passe label .ast { color: #f23f42; padding-left: 4px; }
  #passe label.erro { color: #fa777c; }
  #passe input { width: 100%; height: 40px; border: 0; border-radius: 3px; background: #1e1f22; color: #dbdee1; font-size: 18px; letter-spacing: 6px; text-align: center; outline: none; font-family: inherit; }
  #passe input:focus { box-shadow: 0 0 0 2px #00a8fc; }
  @media (max-width: 520px) { .card { padding: 24px 16px; } }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: entra .35s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes entra { from { opacity: 0; transform: translateY(12px) scale(.98); } }
  }
</style>
</head>
<body>
  <div class="ceu" aria-hidden="true">
    <b style="width:220px;height:140px;left:6%;top:12%"></b>
    <b style="width:160px;height:110px;right:8%;bottom:14%"></b>
    <b style="width:90px;height:60px;right:22%;top:9%"></b>
    <i style="left:14%;top:30%"></i><i style="left:28%;top:8%"></i><i style="left:44%;top:18%"></i>
    <i style="left:62%;top:6%"></i><i style="left:78%;top:26%"></i><i style="left:88%;top:44%"></i>
    <i style="left:8%;top:64%"></i><i style="left:20%;top:86%"></i><i style="left:52%;top:92%"></i>
    <i style="left:70%;top:80%"></i><i style="left:92%;top:70%"></i><i style="left:36%;top:52%"></i>
  </div>

  <main>
    <section class="card">
      <svg class="app" viewBox="100 100 824 824" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B5BF7"/><stop offset="1" stop-color="#9B4DE0"/></linearGradient></defs><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#g)"/><rect x="292" y="300" width="440" height="110" rx="40" fill="#fff"/><rect x="457" y="300" width="110" height="430" rx="40" fill="#fff"/></svg>
      <h1>Continue pelo aplicativo</h1>
      <p class="sub">Neste computador, conversas, servidores e login abrem só no app do Discord.</p>
      <div class="acoes">
        <a class="botao" href="discord://-/channels/@me">Abrir o app</a>
        <a class="volta" href="https://discord.com/">Voltar para a página inicial</a>
      </div>
      <form id="passe" hidden autocomplete="off">
        <label>PIN<span class="ast">*</span></label>
        <input type="password" inputmode="numeric" maxlength="12" aria-label="PIN">
      </form>
    </section>
  </main>
  <script src="aviso.js" defer></script>
</body>
</html>
